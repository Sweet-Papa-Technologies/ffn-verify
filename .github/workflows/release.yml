name: Release

# Push a tag vX.Y.Z whose version matches both packages. npm publishes with
# provenance (NPM_TOKEN secret until npm trusted publishing is configured);
# PyPI publishes through trusted publishing, with no stored password.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag, npm and PyPI versions agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_v=$(node -p "require('./packages/verify-business/package.json').version")
          py_v=$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          echo "tag $tag, npm $npm_v, PyPI $py_v"
          test "$tag" = "$npm_v" && test "$tag" = "$py_v"

  npm:
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - name: Pack (prepack builds; the pnpmfile strips devDependencies and scripts)
        working-directory: packages/verify-business
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Publish with provenance
        run: npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Test and build
        working-directory: python
        run: |
          pip install -e . build twine
          python -m unittest discover -s tests
          python -m build
          twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist/
